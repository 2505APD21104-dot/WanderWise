<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | WanderWise</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .auth-container {
      max-width: 400px; margin: 120px auto 60px auto; background: var(--bg-card);
      padding: 40px; border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--shadow);
    }
    .auth-tabs { display: flex; margin-bottom: 30px; border-bottom: 2px solid var(--border); }
    .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: var(--text-muted); }
    .auth-tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">Wander<span>Wise</span></a>
      <div style="display: flex; align-items: center; gap: 15px;">
        <button class="theme-toggle" id="theme-toggle">🌙</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="auth-container">
      <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchTab('login')">Login</div>
        <div class="auth-tab" onclick="switchTab('register')">Register</div>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form active">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="log-email" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="log-pass" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-pass" class="form-control" required minlength="6">
        </div>
        <button type="submit" class="btn btn-accent" style="width:100%;">Create Account</button>
      </form>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.querySelector(`.auth-tab[onclick="switchTab('${tab}')"]`).classList.add('active');
      document.getElementById(`${tab}-form`).classList.add('active');
    }

    // Handle Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('log-email').value;
      const password = document.getElementById('log-pass').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('wanderwise_token', data.token);
        localStorage.setItem('wanderwise_user', data.user.name);
        window.location.href = 'index.html'; 
      } else {
        alert(data.error);
      }
    });

    // Handle Register
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-pass').value;

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('wanderwise_token', data.token);
        localStorage.setItem('wanderwise_user', data.user.name);
        window.location.href = 'index.html'; 
      } else {
        alert(data.error);
      }
    });
  </script>
</body>
</html>
