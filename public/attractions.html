<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attractions | WanderWise</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">Wander<span>Wise</span></a>
      <nav class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="destinations.html">Destinations</a>
        <a href="map.html">India Map</a>
        <a href="attractions.html">Attractions</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="itinerary.html">Itinerary</a>
        <a href="weather.html">Weather</a>
        <a href="budget.html">Budget</a>
        <a href="expenses.html">Expenses</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="about.html">About</a>
      </nav>
      <div style="display: flex; align-items: center; gap: 15px;">
        <button class="theme-toggle" id="theme-toggle">🌙</button>
        <button class="menu-btn" id="menu-btn">☰</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 120px; padding-bottom: 60px;">
    <h2 class="section-title">Tourist Attractions</h2>
    <p class="section-subtitle">Explore iconic landmarks and heritage sites across India.</p>

    <div class="grid-3" id="attractions-grid">
      <p style="text-align:center; width:100%;">Loading attractions...</p>
    </div>
  </main>

  <!-- Review Modal (Hidden by default) -->
  <div id="review-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
    <div style="background: var(--bg-card); width: 90%; max-width: 500px; padding: 30px; border-radius: 20px; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
      <button onclick="closeModal()" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-main);">✕</button>
      
      <h2 id="modal-title" style="color: var(--primary); margin-bottom: 5px;">Attraction Name</h2>
      <div id="modal-rating-summary" style="color: #f59e0b; font-weight: bold; margin-bottom: 20px;"></div>

      <!-- Review Form -->
      <form id="review-form" style="margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px;">
        <input type="hidden" id="review-attraction-id">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="review-name" class="form-control" required placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label>Rating (1 to 5 Stars)</label>
          <select id="review-rating" class="form-control" required>
            <option value="5">⭐⭐⭐⭐⭐ (Excellent)</option>
            <option value="4">⭐⭐⭐⭐ (Very Good)</option>
            <option value="3">⭐⭐⭐ (Average)</option>
            <option value="2">⭐⭐ (Poor)</option>
            <option value="1">⭐ (Terrible)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Comment</label>
          <textarea id="review-comment" class="form-control" rows="3" required placeholder="Share your experience..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Review</button>
      </form>

      <!-- List of Reviews -->
      <h3 style="margin-bottom: 15px;">Visitor Reviews</h3>
      <div id="reviews-list">
        <!-- Injected by JS -->
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/attractions.js"></script>
  <script src="js/assistant.js"></script>
</body>
</html>
